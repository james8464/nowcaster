[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alternative-data-earnings-nowcaster"
version = "0.1.0"
description = "Point-in-time alternative-data earnings forecasting research platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.2",
  "duckdb-engine>=0.17",
  "httpx>=0.28",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "platformdirs>=4.3",
  "plotly>=6.0",
  "pytz>=2025.2",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "sqlalchemy>=2.0",
  "statsmodels>=0.14",
  "streamlit>=1.42",
  "tenacity>=9.0",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "freezegun>=1.5",
  "nbformat>=5.10",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.11",
]
gsquant = ["gs-quant>=1.3"]

[project.scripts]
nowcaster = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

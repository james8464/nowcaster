name: Native macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install and rebuild evidence
        run: |
          python -m pip install --index-url https://pypi.org/simple -e '.[dev]'
          make demo
          make sync-macos-snapshot
          make macos-test
          make macos-app
      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/nowcaster-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" build/Nowcaster.app
      - name: Notarize signed app
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Nowcaster.app "$RUNNER_TEMP/Nowcaster-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Nowcaster-notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/Nowcaster.app
      - name: Package app and checksum
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Nowcaster.app Nowcaster-macOS.zip
          shasum -a 256 Nowcaster-macOS.zip > Nowcaster-macOS.zip.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nowcaster-macOS
          path: |
            build/Nowcaster-macOS.zip
            build/Nowcaster-macOS.zip.sha256
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Nowcaster-macOS.zip
            build/Nowcaster-macOS.zip.sha256

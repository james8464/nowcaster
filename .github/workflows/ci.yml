name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --index-url https://pypi.org/simple -e '.[dev]'
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Python tests with coverage
        run: pytest --cov=src --cov-report=term-missing -q
      - name: Clean deterministic demo
        run: |
          make clean-generated
          make demo
          test -s data/app/nowcaster-snapshot.json

  native-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test --package-path macos/Nowcaster
      - name: Assemble and verify app
        run: |
          make macos-app
          codesign --verify --deep --strict build/Nowcaster.app
          plutil -lint build/Nowcaster.app/Contents/Info.plist

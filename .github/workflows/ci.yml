name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --index-url https://pypi.org/simple -e '.[dev]'
      - name: Ruff
        run: |
          .venv/bin/ruff format --check .
          .venv/bin/ruff check .
      - name: Python tests with coverage
        run: .venv/bin/pytest --cov=src --cov-report=term-missing -q
      - name: Tracked-file secret scan
        run: make secret-scan
      - name: Snapshot v2, deterministic research, and fixture drift
        run: make verify-research-fixtures
      - name: Generated research-artifact cleanliness
        run: git diff --exit-code -- data/research/ci
      - name: Clean deterministic demo
        run: |
          make clean-generated
          make demo
          make sync-macos-snapshot
          test -s data/app/nowcaster-snapshot.json

  native-macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Verify Swift toolchain
        run: swift --version
      - name: Swift tests
        run: swift test --package-path macos/Nowcaster
      - name: Swift release build
        run: swift build -c release --package-path macos/Nowcaster
      - name: Assemble and verify app
        run: |
          make macos-app
          codesign --verify --deep --strict build/Nowcaster.app
          plutil -lint build/Nowcaster.app/Contents/Info.plist
